# Deploy opcional no Render.com (Docker)
# https://dashboard.render.com → New → Blueprint → conecte este repositório

services:
  - type: web
    name: mentor-gestao-industrial
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: LLM_PROVIDER
        value: opencode_go
      - key: OPENCODE_GO_API_KEY
        sync: false
      - key: OPENCODE_GO_MODEL
        value: deepseek-v4-flash
      - key: SERPER_API_KEY
        sync: false
      - key: PORT
        value: "8501"
